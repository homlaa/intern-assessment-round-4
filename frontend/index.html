<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - Round 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group-full {
            grid-column: 1 / -1;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 120px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-generate {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .btn-clear {
            background: #f0f0f0;
            color: #555;
        }
        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            min-height: 20px;
        }
        .success {
            color: #27ae60;
            font-size: 13px;
            margin-top: 5px;
        }
        .profile-section {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: none;
        }
        .profile-section.active {
            display: block;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        .profile-picture {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #667eea;
        }
        .profile-details {
            flex: 1;
        }
        .profile-details p {
            margin: 5px 0;
            color: #555;
            font-size: 14px;
        }
        .profile-details strong {
            color: #333;
        }
        .spinner {
            display: none;
            text-align: center;
            margin: 10px 0;
        }
        .spinner.active {
            display: block;
        }
        .spinner div {
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .required {
            color: #e74c3c;
            margin-left: 2px;
        }
        .api-status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }
        .api-status.error {
            background: #fee;
            color: #c0392b;
            border: 1px solid #fcc;
        }
        .api-status.success {
            background: #efe;
            color: #27ae60;
            border: 1px solid #cfc;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 20px;
            }
            .button-group {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registration Form</h1>
        
        <form id="registrationForm">
            <div class="form-row">
                <div class="form-group">
                    <label>First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" placeholder="Enter first name" required>
                </div>
                
                <div class="form-group">
                    <label>Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" placeholder="Enter last name" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Birthdate <span class="required">*</span></label>
                <input type="date" id="birthdate" required>
            </div>
            
            <div class="form-group">
                <label>Note</label>
                <textarea id="note" placeholder="Enter any additional notes..."></textarea>
            </div>
            
            <div id="errorMessages" class="error"></div>
            <div id="successMessage" class="success"></div>
            
            <div class="spinner" id="spinner">
                <div></div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-save" onclick="saveRegistration()">Save</button>
                <button type="button" class="btn-generate" onclick="generateProfile()">Generate Profile</button>
                <button type="button" class="btn-clear" onclick="clearForm()">Clear</button>
            </div>
        </form>
        
        <div id="profileSection" class="profile-section">
            <h3>👤 Generated Profile</h3>
            <div class="profile-header">
                <img id="profilePicture" class="profile-picture" src="" alt="Profile Picture">
                <div class="profile-details">
                    <p><strong>Email:</strong> <span id="profileEmail">-</span></p>
                    <p><strong>Phone:</strong> <span id="profilePhone">-</span></p>
                    <p><strong>Country:</strong> <span id="profileCountry">-</span></p>
                    <p><strong>City:</strong> <span id="profileCity">-</span></p>
                </div>
            </div>
        </div>
        
        <div id="apiStatus" class="api-status" style="display:none;"></div>
    </div>

    <script>
        let generatedProfile = null;

        async function generateProfile() {
            const statusDiv = document.getElementById('apiStatus');
            statusDiv.style.display = 'block';
            statusDiv.className = 'api-status';
            
            // Show spinner
            document.getElementById('spinner').classList.add('active');
            
            try {
                // First call - valid endpoint
                const response = await fetch('https://randomuser.me/api/');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                const user = data.results[0];
                
                // Store generated profile
                generatedProfile = {
                    email: user.email,
                    phone: user.phone,
                    country: user.location.country,
                    city: user.location.city,
                    picture: user.picture.large
                };
                
                // Display profile
                document.getElementById('profilePicture').src = generatedProfile.picture;
                document.getElementById('profileEmail').textContent = generatedProfile.email;
                document.getElementById('profilePhone').textContent = generatedProfile.phone;
                document.getElementById('profileCountry').textContent = generatedProfile.country;
                document.getElementById('profileCity').textContent = generatedProfile.city;
                document.getElementById('profileSection').classList.add('active');
                
                statusDiv.className = 'api-status success';
                statusDiv.innerHTML = '✅ Profile generated successfully!';
                
                // Second call - invalid endpoint (for troubleshooting)
                try {
                    const invalidResponse = await fetch('https://randomuser.me/api/invalid');
                    // This will fail, but we handle it gracefully
                    if (!invalidResponse.ok) {
                        throw new Error(`HTTP ${invalidResponse.status}: ${invalidResponse.statusText}`);
                    }
                } catch (invalidError) {
                    // Extract real HTTP status from the error
                    const statusMatch = invalidError.message.match(/HTTP (\d+)/);
                    const statusCode = statusMatch ? statusMatch[1] : 'Unknown';
                    
                    console.log('Invalid endpoint error (expected):', invalidError.message);
                    
                    // Show the error but don't fail the profile generation
                    const invalidStatusDiv = document.createElement('div');
                    invalidStatusDiv.className = 'api-status error';
                    invalidStatusDiv.style.marginTop = '10px';
                    invalidStatusDiv.innerHTML = `⚠️ Profile API invalid endpoint returned status: ${statusCode} (expected error for troubleshooting)`;
                    document.getElementById('profileSection').appendChild(invalidStatusDiv);
                    
                    // Also show in the main status
                    statusDiv.innerHTML += `<br><span style="color:#e74c3c;">⚠️ Invalid endpoint test: ${invalidError.message}</span>`;
                }
                
            } catch (error) {
                statusDiv.className = 'api-status error';
                statusDiv.innerHTML = `❌ Failed to generate profile: ${error.message}`;
                document.getElementById('profileSection').classList.remove('active');
            } finally {
                document.getElementById('spinner').classList.remove('active');
            }
        }

        async function saveRegistration() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const birthdate = document.getElementById('birthdate').value;
            const note = document.getElementById('note').value.trim();
            
            // Clear previous messages
            document.getElementById('errorMessages').textContent = '';
            document.getElementById('successMessage').textContent = '';
            
            // Validate required fields
            const errors = [];
            if (!firstName) errors.push('First Name is required');
            if (!lastName) errors.push('Last Name is required');
            if (!birthdate) errors.push('Birthdate is required');
            
            if (errors.length > 0) {
                document.getElementById('errorMessages').textContent = '⚠️ ' + errors.join(', ');
                return;
            }
            
            // Check if profile was generated
            if (!generatedProfile) {
                document.getElementById('errorMessages').textContent = '⚠️ Please generate a profile first (click "Generate Profile")';
                return;
            }
            
            // Show spinner
            document.getElementById('spinner').classList.add('active');
            
            try {
                const saveData = {
                    firstName,
                    lastName,
                    birthdate,
                    note: note || null,
                    profile: generatedProfile
                };
                
                const response = await fetch('http://localhost:3000/api/attendees', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(saveData)
                });
                
                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.error || 'Failed to save registration');
                }
                
                document.getElementById('successMessage').textContent = '✅ Registration saved successfully!';
                
                // Clear form after successful save (optional)
                // clearForm();
                
            } catch (error) {
                document.getElementById('errorMessages').textContent = '❌ ' + error.message;
            } finally {
                document.getElementById('spinner').classList.remove('active');
            }
        }

        function clearForm() {
            document.getElementById('firstName').value = '';
            document.getElementById('lastName').value = '';
            document.getElementById('birthdate').value = '';
            document.getElementById('note').value = '';
            document.getElementById('profileSection').classList.remove('active');
            document.getElementById('errorMessages').textContent = '';
            document.getElementById('successMessage').textContent = '';
            document.getElementById('apiStatus').style.display = 'none';
            generatedProfile = null;
            
            // Remove any extra status messages
            const extraStatus = document.querySelectorAll('.api-status.error');
            extraStatus.forEach(el => el.remove());
        }

        // Add Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const target = e.target;
                if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') {
                    e.preventDefault();
                    saveRegistration();
                }
            }
        });
    </script>
</body>
</html>
